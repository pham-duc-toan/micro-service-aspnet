apiVersion: v1
kind: Service
metadata:
  name: inventorydb
  namespace: tedu
  labels:
    app: inventorydb
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: inventorydb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventorydb
  namespace: tedu
spec:
  serviceName: inventorydb
  replicas: 1
  selector:
    matchLabels:
      app: inventorydb
  template:
    metadata:
      labels:
        app: inventorydb
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
