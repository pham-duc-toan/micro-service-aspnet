apiVersion: v1
kind: Service
metadata:
  name: hangfiredb
  namespace: tedu
  labels:
    app: hangfiredb
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: hangfiredb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hangfiredb
  namespace: tedu
spec:
  serviceName: hangfiredb
  replicas: 1
  selector:
    matchLabels:
      app: hangfiredb
  template:
    metadata:
      labels:
        app: hangfiredb
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: mongo-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: mongo-root-password
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - -u
                - admin
                - -p
                - admin
                - --authenticationDatabase
                - admin
                - --eval
                - "db.runCommand({ ping: 1 }).ok"
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
