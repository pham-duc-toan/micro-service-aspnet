apiVersion: v1
kind: Service
metadata:
  name: tedu-identity-api
  namespace: tedu
  labels:
    app: tedu-identity-api
spec:
  type: ClusterIP
  selector:
    app: tedu-identity-api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tedu-identity-api
  namespace: tedu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tedu-identity-api
  template:
    metadata:
      labels:
        app: tedu-identity-api
        tier: identity
    spec:
      containers:
        - name: tedu-identity-api
          image: tedu-identity-api:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: ConnectionStrings__IdentitySqlConnection
              value: "Server=identitydb;Database=TeduIdentity;User Id=sa;Password=$(SA_PASSWORD);Multipleactiveresultsets=true;TrustServerCertificate=true;Connection Timeout=30;"
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: mssql-sa-password
            - name: IdentityServer__BaseUrl
              value: "http://idp.tedu.local"
            - name: IdentityServer__IssuerUri
              value: "http://tedu-identity-api"
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
