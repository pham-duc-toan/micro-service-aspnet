apiVersion: v1
kind: Service
metadata:
  name: apigw-ocelot
  namespace: tedu
  labels:
    app: apigw-ocelot
spec:
  type: ClusterIP
  selector:
    app: apigw-ocelot
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigw-ocelot
  namespace: tedu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apigw-ocelot
  template:
    metadata:
      labels:
        app: apigw-ocelot
        tier: edge
    spec:
      containers:
        - name: apigw-ocelot
          image: apigw-ocelot:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: GlobalConfiguration__BaseUrl
              value: "http://api.tedu.local"
            - name: ApiConfig__IdentityServerBaseUrl
              value: "http://tedu-identity-api"
            - name: ApiConfig__IssuerUri
              value: "http://tedu-identity-api"
            - name: ElasticConfiguration__Uri
              value: "http://elasticsearch:9200"
            - name: ElasticConfiguration__Username
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: username
            - name: ElasticConfiguration__Password
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
