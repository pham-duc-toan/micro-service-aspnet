apiVersion: v1
kind: Service
metadata:
  name: ordering-api
  namespace: tedu
  labels:
    app: ordering-api
spec:
  type: ClusterIP
  selector:
    app: ordering-api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-api
  namespace: tedu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ordering-api
  template:
    metadata:
      labels:
        app: ordering-api
        tier: business
    spec:
      containers:
        - name: ordering-api
          image: ordering-api:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: mssql-sa-password
            - name: DatabaseSettings__ConnectionString
              value: "Server=orderdb;Database=OrderDb;User Id=sa;Password=$(DB_PASSWORD);Multipleactiveresultsets=true;TrustServerCertificate=true"
            - name: ElasticConfiguration__Username
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: username
            - name: ElasticConfiguration__Password
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /hc
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /hc
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
