apiVersion: v1
kind: Service
metadata:
  name: basket-api
  namespace: tedu
  labels:
    app: basket-api
spec:
  type: ClusterIP
  selector:
    app: basket-api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
  namespace: tedu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: basket-api
  template:
    metadata:
      labels:
        app: basket-api
        tier: business
    spec:
      containers:
        - name: basket-api
          image: basket-api:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: CacheSettings__ConnectionString
              value: "basketdb:6379"
            - name: GrpcSettings__StockUrl
              value: "http://inventory-grpc"
            - name: BackgroundJobSettings__HangfireUrl
              value: "http://hangfire-api"
            - name: BackgroundJobSettings__CheckoutUrl
              value: "http://apigw-ocelot"
            - name: ElasticConfiguration__Username
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: username
            - name: ElasticConfiguration__Password
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /hc
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /hc
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
